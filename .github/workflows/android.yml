name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-4.7.2-stable

      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          curl -L --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godotbin
          mv /tmp/godotbin/Godot_v4.7.2-stable_linux.x86_64 /opt/godot/godot
          chmod +x /opt/godot/godot
          curl -L --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/tpz /home/runner/.local/share/godot/export_templates
          unzip -o /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates /home/runner/.local/share/godot/export_templates/4.7.2.stable

      - name: Add Godot to PATH
        run: echo "/opt/godot" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # یافتن یا نصب sdkmanager
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            echo "دانلود cmdline-tools..."
            curl -sSL --retry 3 -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true
          echo "Android SDK آماده است"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/chistan-release.keystore

      - name: Godot import
        run: |
          godot --headless --path . --import
          godot --headless --path . --import

      - name: Install Android build template
        run: godot --headless --path . --install-android-build-template

      - name: Generate debug keystore (for debug APK)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ""
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ""
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ""
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/chistan-debug.apk

      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/chistan-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_ALIAS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          godot --headless --path . --export-release "Android APK" build/chistan.apk

      - name: Export release AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/chistan-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_ALIAS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          godot --headless --path . --export-release "Android AAB" build/chistan.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chistan-debug-apk
          path: build/chistan-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chistan-release-apk
          path: build/chistan.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: chistan-release-aab
          path: build/chistan.aab

      - name: GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/chistan.apk
            build/chistan.aab
          generate_release_notes: true
