name: Bisect 1 (header+cache+download)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  b1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Godot editor and templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-4.7.2-stable
      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: echo skip
      - name: Add Godot to PATH
        run: echo "/opt/godot" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
