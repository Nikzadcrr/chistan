name: Bisect 2 (exports+release)
on:
  workflow_dispatch:
jobs:
  b2:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo decoded
      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ""
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ""
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ""
        run: echo export1
      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/chistan-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_ALIAS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: echo export2
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: test-debug
          path: README.md
      - name: GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
