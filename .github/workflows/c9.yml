name: C9 four exprs no secret
on:
  workflow_dispatch:
jobs:
  c9:
    runs-on: ubuntu-latest
    steps:
      - name: four envs
        env:
          E1: ${{ github.repository }}
          E2: /tmp/chistan-release.keystore
          E3: ${{ github.repository_owner }}
          E4: ${{ github.event_name }}
        run: echo "$E1 $E2 $E3 $E4"
